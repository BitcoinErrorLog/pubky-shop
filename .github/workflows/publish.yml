name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run gate

      - name: Verify package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "Release tag: ${RELEASE_TAG}"
          echo "Expected package version (initial v removed if present): ${expected_version}"
          echo "package.json version: ${package_version}"
          if [[ -z "${expected_version}" || "${package_version}" != "${expected_version}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package.json version ${package_version}"
            exit 1
          fi

      # Node 22 ships npm 10.x. OIDC trusted publishing needs npm ≥ 11.5.1;
      # npm 10 signs Sigstore provenance then PUTs unauthenticated → 404 on
      # scoped packages. setup-node with registry-url also injects
      # NODE_AUTH_TOKEN (GitHub token), which overrides OIDC even on npm 11.
      - name: Install npm for OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm --version

      - name: Build package
        run: npm run build

      - name: Verify packed bin
        run: |
          set -euo pipefail
          bin_path="$(node -p "require('./package.json').bin['pubky-shop']")"
          if [[ "${bin_path}" != "dist/cli/bin.js" ]]; then
            echo "::error::package.json bin.pubky-shop must be dist/cli/bin.js (no ./ prefix); got ${bin_path}"
            exit 1
          fi
          if [[ ! -f "${bin_path}" ]]; then
            echo "::error::bin path ${bin_path} does not exist at pack time"
            exit 1
          fi
          pack_json="$(npm pack --dry-run --json)"
          printf '%s\n' "${pack_json}" | node --input-type=module -e '
            const chunks = [];
            for await (const c of process.stdin) chunks.push(c);
            const d = JSON.parse(Buffer.concat(chunks).toString("utf8"));
            const entry = Array.isArray(d) ? d[0] : d;
            const files = (entry.files || []).map((f) => f.path || f);
            if (!files.includes("dist/cli/bin.js")) {
              console.error("dist/cli/bin.js missing from npm pack --dry-run");
              process.exit(1);
            }
            console.log("packed dist/cli/bin.js ok; files", files.length);
          '

      - name: Publish
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "${NPM_CONFIG_USERCONFIG}" ]]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          npm --version
          npm publish --access public --provenance

      - name: Verify published tarball
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "${NPM_CONFIG_USERCONFIG}" ]]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          package_version="$(node -p "require('./package.json').version")"
          tarball=""
          for attempt in $(seq 1 10); do
            if tarball="$(npm view "@bitcoinerrorlog/pubky-shop@${package_version}" dist.tarball 2>/dev/null)" \
              && [[ -n "${tarball}" ]]; then
              echo "Published tarball: ${tarball}"
              exit 0
            fi
            echo "npm view missed ${package_version} (attempt ${attempt}/10); waiting 30s for registry processing"
            if [[ "${attempt}" -lt 10 ]]; then
              sleep 30
            fi
          done
          echo "::error::npm returned no dist.tarball for @bitcoinerrorlog/pubky-shop@${package_version} after 10 attempts"
          exit 1
