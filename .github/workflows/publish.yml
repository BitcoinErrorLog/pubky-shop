name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run gate

      - name: Verify package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "Release tag: ${RELEASE_TAG}"
          echo "Expected package version (initial v removed if present): ${expected_version}"
          echo "package.json version: ${package_version}"
          if [[ -z "${expected_version}" || "${package_version}" != "${expected_version}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Verify published tarball
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tarball="$(npm view "@bitcoinerrorlog/pubky-shop@${package_version}" dist.tarball)"
          if [[ -z "${tarball}" ]]; then
            echo "::error::npm returned no dist.tarball for @bitcoinerrorlog/pubky-shop@${package_version}"
            exit 1
          fi
          echo "Published tarball: ${tarball}"
